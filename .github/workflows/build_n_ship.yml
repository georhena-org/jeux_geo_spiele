name: Build n Ship Jeux-Geo
# needs 4 secrets: DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

# needs 2 env variables
env:
  PROJECT_NAME : "jeux_geo"               # will be used for the image name, and for the archive name
  METADATA_FILE : "cicd_metadata.json"   # metadata file containing the image_version attribute (should be in X.Y.Z format), default is cicd_metadata.json

jobs:
  build_and_ship:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH (key file + known_hosts)
        run: |
          set -euo pipefail
      
          install -m 700 -d "$HOME/.ssh"
      
          # Write private key directly to the one file we will use
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s' '${{ secrets.DEPLOY_SSH_KEY }}' | tr -d '\r' > "$HOME/.ssh/deploy_key"
          
          # Pin server host key (do NOT disable host key checking)
          ssh-keyscan -p '${{ secrets.DEPLOY_PORT }}' '${{ secrets.DEPLOY_HOST }}' >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          
      - name: Validate private key shape
        shell: bash
        run: |
          set -euo pipefail
      
          echo "=== File info ==="
          ls -l "$HOME/.ssh/deploy_key"
          wc -l "$HOME/.ssh/deploy_key"
      
          echo
          echo "=== First & last line ==="
          head -n 1 "$HOME/.ssh/deploy_key"
          tail -n 1 "$HOME/.ssh/deploy_key"
      
          echo
          echo "=== Check for Windows CRLF (^M) ==="
          if grep -q $'\r' "$HOME/.ssh/deploy_key"; then
            echo "❌ CR characters detected"
            exit 1
          else
            echo "✅ No CR characters"
          fi
      
          echo
          echo "=== Validate SSH key parsing ==="
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
          echo "✅ SSH key parses correctly"

          
      - name: Debug – SSH verbose test
        shell: bash
        run: |
          ssh -vvv \
            -p '${{ secrets.DEPLOY_PORT }}' \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' true
            
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version and compute tags and archive name
        id: meta
        run: |
          set -euo pipefail
          ver="$(jq -r '.image_version // empty' "${METADATA_FILE}")"
          if [[ -z "$ver" ]]; then
            echo "image_version missing in ${METADATA_FILE}" >&2
            exit 1
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image_version must match X.Y.Z, got: $ver" >&2
            exit 1
          fi
          echo "parsed version: $ver"
          short_sha="${GITHUB_SHA::7}"
        
          tag="$ver-sha_${short_sha}"
          archive="${PROJECT_NAME}-${tag}.tar.zst"
        
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
        
          echo "Image tag: $tag"
          echo "Archive name: $archive"


      - name: Build docker image
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          docker build -t "${PROJECT_NAME}:${{ steps.meta.outputs.tag }}" .

      - name: Save image archive (docker save | zstd)
        run: |
          set -euo pipefail
          archive="${{ steps.meta.outputs.archive }}"

          # zstd level 3
          docker save "${PROJECT_NAME}:${{ steps.meta.outputs.tag }}" \
            | zstd -3 -T0 \
            > "$archive"

          ls -lh "$archive"

      - name: Send archive to server
        run: |
          set -euo pipefail
          archive='${{ steps.meta.outputs.archive }}'
      
          sftp -b - \
            -P '${{ secrets.DEPLOY_PORT }}' \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' <<EOF
          put "$archive" "$archive"
          EOF
