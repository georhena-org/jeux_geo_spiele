{% extends "base.html"%}

{% load static %}

{% block title%} Géophysique du Rhin Supérieur{% endblock%}

{% block content %}
  <h1 id = "page-title">Géophysique du Rhin Supérieur</h1>
     <div id='webmap' class="map"></div>
      <div id="side-panel"> 
        <div id="endGameMessage" style="display:none; text-align:center; padding:1em; background:white; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); max-width:400px; margin:20px auto; font-family:sans-serif;">
          <p id="finalMessage" style="font-size:18px; font-weight:bold;"></p>
          <p id="finalScore"></p>
          <p id="finalTime"></p>
          <button id="restartBtn">Rejouer</button>
          <button onclick= "window.open('https://geoportal.georhena.eu/datahub/dataset/8a035f1f-61a0-4f25-a551-c24297cd32a4','_blank')" id="exploreBtn">Explorer la donnée</button>          
        </div>
        <div id = "guess">
          <div id = "randomText"></div>
        </div>
        <div id = "test">
          <h2>Essais restants </h2>
          <div id ="error"></div>
        </div>
        <div id = "points">
          <h2>Points </h2>
          <div id ="number"></div>
        </div>
        <div>
          <span id="chrono">00:00</span>
        </div>
        <div id="tooltipToggleContainer" style="margin-top: 10px; background: white; padding: 5px; border-radius: 5px;">
        <label>
        <input type="checkbox" id="toggleTooltip" checked>
        Afficher le nom des entités au survol
        </label>
        </div>
        <div id = "encouragments"></div>
    </div>
    </div>
  <div id = "tooltip"></div>
{% endblock %}

{% block extra_scripts %}
  <link rel="stylesheet" href="{% static 'jeux/ol.css' %}">
  <link rel="stylesheet" href="{% static 'jeux/styles/styles_geophysique.css' %}">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="{% static 'jeux/ol.js' %}"></script>
  <script>
  const hydroUrl = "{% static 'jeux/data/hydro_rs_4258.geojson' %}";
  const sommetsUrl = "{% static 'jeux/data/sommets_rs_4258.geojson' %}";
  </script>
  <script src="{% static 'jeux/js/geophysique_trad.js' %}"></script>
{% endblock %}
