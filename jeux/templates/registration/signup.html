{% extends "base.html" %}
{% block title %}Inscription / Registreigung{% endblock %}

{% block content %}
  <h2>Inscription / Registrietrung</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style ="margin-top: 10px; font-size: 16px; margin-bottom: 10px; background-color: #161C94; color: white;  border: none; font-family: 'Quicksand', sans-serif; padding: 8px 12px; border-radius: 4px; cursor: pointer;">S'inscrire / Registrieren</button>
  </form>
  <p>Déjà un compte ? <a href="{% url 'login' %}" style="display:inline-block; padding:0.4rem 1rem; background-color:#4CAF50; color:#fff; text-decoration:none; border-radius:4px; font-weight:500; transition:background-color 0.2s ease;">Connexion / Anmeldung</a></p>
{% endblock %}
